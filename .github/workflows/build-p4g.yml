
name: P4G Beta

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test NVN origin transforms
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -I runtime/src tests/nvn_origin_test.cpp -o "$RUNNER_TEMP/nvn-origin-test"
          "$RUNNER_TEMP/nvn-origin-test"
          c++ -std=c++17 -Wall -Wextra -Werror -I runtime/src tests/nvn_frame_pacing_test.cpp -o "$RUNNER_TEMP/nvn-frame-pacing-test"
          "$RUNNER_TEMP/nvn-frame-pacing-test"
          c++ -std=c++17 -Wall -Wextra -Werror -I runtime/src tests/android_surface_size_test.cpp -o "$RUNNER_TEMP/android-surface-size-test"
          "$RUNNER_TEMP/android-surface-size-test"

      - name: Verify P4G files
        shell: bash
        run: |
          set -euo pipefail

          test -f games/p4g/game.cpp
          test -f games/p4g/AndroidManifest.xml
          test -f games/p4g/import/p4g_import_jni.cpp
          test -f games/p4g/import/p4g_shaders.cpp

          echo "P4G source files found."

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          echo "Android build tools installed."

      - name: Verify Android tools
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          ninja --version

          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

          echo "Android build environment ready."

      - name: Download Vulkan Headers
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            --branch v1.4.357 \
            https://github.com/KhronosGroup/Vulkan-Headers.git \
            vulkan-headers

          ln -s include vulkan-headers/Include

          test -f vulkan-headers/Include/vulkan/vulkan.h

          echo "Vulkan Headers ready."

      - name: Download P4G shader ARM64 library
        uses: actions/download-artifact@v4
        with:
          name: p4g-shader-arm64-link-diagnostics
          run-id: 41317050938
          github-token: ${{ github.token }}
          path: build-shader-artifact

      - name: Prepare P4G shader runtime
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          OUT="build-apk/shader-libs"

          mkdir -p "$OUT"

          echo "Finding Vita3K shader library..."

          mapfile -t shaders < <(
            find build-shader-artifact \
              -type f \
              -name 'libp4gshader.so' \
              | sort
          )

          if [ "${#shaders[@]}" -ne 1 ]; then
            echo "Expected exactly one libp4gshader.so."
            printf '%s\n' "${shaders[@]}"
            exit 1
          fi

          SHADER="${shaders[0]}"

          test -s "$SHADER"

          echo "Checking C++ shared runtime..."

          CPP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -s "$CPP"

          cp "$SHADER" "$OUT/libp4gshader.so"
          cp "$CPP" "$OUT/libc++_shared.so"

          echo "Checking ARM64 architecture..."

          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          "$READELF" -h "$OUT/libp4gshader.so" \
            > "$OUT/shader-elf.txt"

          grep -q AArch64 "$OUT/shader-elf.txt"

          echo "Checking exported C API..."

          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"

          "$NM" -D --defined-only \
            "$OUT/libp4gshader.so" \
            > "$OUT/shader-symbols.txt"

          grep -Eq '[[:space:]]p4g_shader_api_version$' \
            "$OUT/shader-symbols.txt"

          grep -Eq '[[:space:]]p4g_shader_convert$' \
           "$OUT/shader-symbols.txt"

          echo "Checking runtime dependencies..."

          "$READELF" -d \
            "$OUT/libp4gshader.so" \
            > "$OUT/shader-dependencies.txt"

          cat "$OUT/shader-dependencies.txt"

          echo "P4G shader runtime ready."
          ls -lh "$OUT"/*.so

      - name: Configure P4G ARM64
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/28.2.13676358"

          cmake -S . \
            -B build-p4g \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DNX_VULKAN_SDK="$GITHUB_WORKSPACE/vulkan-headers" \
            -DNX_GAME=p4g \
            -DNX_NCE=ON

          echo "P4G ARM64 configuration ready."

      - name: Build P4G native library
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build-p4g \
            --target p4g \
            --parallel 2

          test -s build-p4g/libp4g.so

          echo "P4G native library built."

      - name: Build P4G importer
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build-p4g \
            --target p4gimport \
            --parallel 2

          test -s build-p4g/libp4gimport.so

          echo "P4G importer built."

      - name: Upload P4G native libraries
        uses: actions/upload-artifact@v4
        with:
          name: p4g-android-arm64-libs
          path: |
            build-p4g/libp4g.so
            build-p4g/libp4gimport.so
            build-apk/shader-libs/libp4gshader.so
            build-apk/shader-libs/libc++_shared.so
          if-no-files-found: error

      - name: Compile P4G Java classes
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-java/classes

          find games/p4g/java \
            -name "*.java" \
            > build-java/sources.txt

          test -s build-java/sources.txt

          javac \
            -encoding UTF-8 \
            --release 8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build-java/classes \
            @build-java/sources.txt

          echo "P4G Java compilation successful."

      - name: Test P4G preparation and save imports
        # Host tests run after the real Android Java compilation above.
        # Keep UI/native lifecycle validation on the device.
        if: success()
        shell: bash
        run: python3 tests/test_app_flow.py

      - name: Generate P4G DEX bytecode
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-java/dex

          find build-java/classes \
            -name "*.class" \
            > build-java/class-files.txt

          mapfile -t classes < build-java/class-files.txt

          test "${#classes[@]}" -gt 0

          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --release \
            --min-api 30 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output build-java/dex \
            "${classes[@]}"

          test -s build-java/dex/classes.dex

          echo "P4G DEX generated."

      - name: Upload P4G DEX
        uses: actions/upload-artifact@v4
        with:
          name: p4g-android-dex
          path: build-java/dex/classes.dex
          if-no-files-found: error

      - name: Build P4G APK resources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-apk

          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"

          "$AAPT2" compile \
            --dir android/res \
            -o build-apk/resources.zip

          "$AAPT2" link \
            -o build-apk/base.apk \
            -I "$ANDROID_JAR" \
            --manifest games/p4g/AndroidManifest.xml \
            build-apk/resources.zip

          test -s build-apk/base.apk

          echo "P4G APK resources built."

      - name: Package P4G APK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path("build-apk/base.apk")

          files = {
              "classes.dex":
                  "build-java/dex/classes.dex",

              "lib/arm64-v8a/libp4g.so":
                  "build-p4g/libp4g.so",

              "lib/arm64-v8a/libp4gimport.so":
                  "build-p4g/libp4gimport.so",

              "lib/arm64-v8a/libp4gshader.so":
                  "build-apk/shader-libs/libp4gshader.so",

              "lib/arm64-v8a/libc++_shared.so":
                  "build-apk/shader-libs/libc++_shared.so",
          }

          # Include the ready-to-use runtime pack, not the numbered GXP cache.
          shader_root = Path("games/p4g/assets/spirv")
          manifest = shader_root / "manifest.tsv"
          if not manifest.is_file():
              raise FileNotFoundError(manifest)
          import hashlib
          import re
          records = [line.split("\t") for line in manifest.read_text().splitlines() if line.strip()]
          if not records:
              raise RuntimeError("Bundled shader pack is empty")
          if not any(row[0] == "results.tsv" for row in records):
              raise RuntimeError("Bundled shader resources metadata results.tsv is missing")
          for name, digest, length in records:
              if not re.fullmatch(r"(?:[0-9a-f]{16}\.spv|results\.tsv)", name):
                  raise RuntimeError("Invalid bundled shader name")
              source = shader_root / name
              data = source.read_bytes()
              if len(data) != int(length) or hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError(f"Bundled shader hash mismatch: {name}")
              if name == "results.tsv":
                  lines = data.decode("utf-8").splitlines()
                  header = lines[0].split("\t") if lines else []
                  if not header or header[0] != "hash" or "resources" not in header:
                      raise RuntimeError("Invalid results.tsv header")
                  column = header.index("resources")
                  rows = [line.split("\t") for line in lines[1:]]
                  if not any(len(row) > column and re.fullmatch(r"[0-9a-f]{16}", row[0])
                             and row[column] for row in rows):
                      raise RuntimeError("results.tsv has no resource mappings")
              elif len(data) < 20 or len(data) % 4 or data[:4] != bytes.fromhex("03022307"):
                  raise RuntimeError(f"Invalid SPIR-V header: {name}")
              files[f"assets/spirv/{name}"] = str(source)
          files["assets/spirv/manifest.tsv"] = str(manifest)

          if not apk.is_file():
              raise FileNotFoundError(apk)

          with zipfile.ZipFile(apk, "a") as z:
              existing = set(z.namelist())

              for dest, source in files.items():
                  source_path = Path(source)

                  if not source_path.is_file():
                      raise FileNotFoundError(source)

                  if source_path.stat().st_size == 0:
                      raise RuntimeError(
                          f"Empty file: {source}"
                      )

                  if dest in existing:
                      raise RuntimeError(
                          f"Duplicate APK entry: {dest}"
                      )

                  method = (
                      zipfile.ZIP_STORED
                      if dest.startswith("lib/")
                      else zipfile.ZIP_DEFLATED
                  )

                  z.write(
                      source_path,
                      dest,
                      compress_type=method
                  )

                  print(
                      f"Packaged: {dest} "
                      f"({source_path.stat().st_size} bytes)"
                  )

          print("P4G APK packaged successfully.")
          PY

      - name: Verify P4G APK contents
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile

          from pathlib import Path

          apk = "build-apk/base.apk"

          required = [
              "classes.dex",
              "lib/arm64-v8a/libp4g.so",
              "lib/arm64-v8a/libp4gimport.so",
              "lib/arm64-v8a/libp4gshader.so",
              "lib/arm64-v8a/libc++_shared.so",
          ]

          manifest = Path("games/p4g/assets/spirv/manifest.tsv")
          required += ["assets/spirv/manifest.tsv"]
          required += ["assets/spirv/" + line.split("\t")[0]
                       for line in manifest.read_text().splitlines() if line.strip()]

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()

              for name in required:
                  if names.count(name) != 1:
                      raise RuntimeError(
                          f"Missing or duplicate: {name}"
                      )

                  info = z.getinfo(name)

                  if info.file_size == 0:
                      raise RuntimeError(
                          f"Empty APK entry: {name}"
                      )

                  print(
                      f"OK: {name} "
                      f"({info.file_size} bytes)"
                  )

              if z.testzip() is not None:
                  raise RuntimeError(
                      "APK ZIP integrity check failed"
                  )

          print("All P4G libraries verified.")
          PY

      - name: Sign P4G APK
        shell: bash
        env:
          P4G_SIGNING_KEY_B64: ${{ secrets.P4G_SIGNING_KEY_B64 }}
          P4G_SIGNING_PASSWORD: ${{ secrets.P4G_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$P4G_SIGNING_KEY_B64" ] || [ -z "$P4G_SIGNING_PASSWORD" ]; then
            echo "Configure repository secrets P4G_SIGNING_KEY_B64 and P4G_SIGNING_PASSWORD."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path("build-apk/p4g-signing.p12").write_bytes(
              base64.b64decode(os.environ["P4G_SIGNING_KEY_B64"].strip(), validate=True)
          )
          PY

          "$BUILD_TOOLS/zipalign" -f -P 16 4 \
            build-apk/base.apk build-apk/aligned.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 4 build-apk/aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks build-apk/p4g-signing.p12 \
            --ks-type PKCS12 \
            --ks-pass env:P4G_SIGNING_PASSWORD \
            --key-pass env:P4G_SIGNING_PASSWORD \
            --out "build-apk/P4G.apk" \
            build-apk/aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            "build-apk/P4G.apk"
          test -s "build-apk/P4G.apk"


      - name: Upload P4G APK
        uses: actions/upload-artifact@v4
        with:
          name: P4G-0.2.0-Beta
          path: build-apk/P4G.apk
          if-no-files-found: error

      - name: Upload shader packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4g-apk-shader-diagnostics
          path: |
            build-apk/shader-libs/shader-elf.txt
            build-apk/shader-libs/shader-symbols.txt
            build-apk/shader-libs/shader-dependencies.txt
          if-no-files-found: warn
