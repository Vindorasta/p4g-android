
name: Persona 4 Golden Android

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify P4G files
        run: |
          test -f games/p4g/game.cpp
          test -f games/p4g/AndroidManifest.xml
          test -f games/p4g/import/p4g_import_jni.cpp
          test -f games/p4g/import/p4g_shaders.cpp
          echo "P4G source files found."


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Android tools
        run: |
          cmake --version
          ninja --version
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "Android build environment ready"
