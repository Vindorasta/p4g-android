
name: Persona 4 Golden Android

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify P4G files
        run: |
          test -f games/p4g/game.cpp
          test -f games/p4g/AndroidManifest.xml
          test -f games/p4g/import/p4g_import_jni.cpp
          test -f games/p4g/import/p4g_shaders.cpp
          echo "P4G source files found."


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Android tools
        run: |
          cmake --version
          ninja --version
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "Android build environment ready"

          
      - name: Configure P4G ARM64
        run: |
          cmake -S . -B build-p4g -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DNX_GAME=p4g \
            -DNX_NCE=ON

