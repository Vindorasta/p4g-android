
name: Build P4G Shader ARM64

on:
  workflow_dispatch:

jobs:
  build-shader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout P4G
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.2.13676358'

      - name: Download Vita3K
        run: |
          git clone --depth 1 \
            https://github.com/Vita3K/Vita3K.git \
            vita3k-source

          git -C vita3k-source rev-parse HEAD \
            > vita3k-commit.txt

      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-dev \
            libspdlog-dev \
            libfmt-dev \
            libglm-dev \
            spirv-tools-dev \
            spirv-headers

          mkdir -p build-shader/third_party
          mkdir -p build-shader/logs
          mkdir -p build-shader/objects

          for dir in boost spdlog fmt glm spirv; do
            if [ -d "/usr/include/$dir" ]; then
              cp -a "/usr/include/$dir" \
                build-shader/third_party/
            fi
          done

      - name: Compile all Vita3K shader sources
        shell: bash
        run: |
          set -u

          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"

          SRC="vita3k-source/vita3k/shader/src"
          OUT="build-shader"

          test -x "$CXX"

          cat > "$OUT/results.tsv" <<'EOF'
          source	status
          EOF

          SUCCESS=0
          FAILED=0

          SOURCES=(
            translator/alu.cpp
            translator/ialu.cpp
            translator/branch_cond.cpp
            translator/data.cpp
            translator/special.cpp
            translator/illegal.cpp
            translator/texture.cpp
            translator/utils.cpp
            gxp_parser.cpp
            usse_disasm.cpp
            usse_program_analyzer.cpp
            usse_decode_helpers.cpp
            usse_translator_entry.cpp
            usse_utilities.cpp
            spirv_recompiler.cpp
          )

          for source in "${SOURCES[@]}"; do
            echo "::group::Compiling $source"

            filename="${source//\//_}"
            object="$OUT/objects/${filename%.cpp}.o"
            log="$OUT/logs/${filename%.cpp}.log"

            if "$CXX" \
              -std=c++23 \
              -include utility \
              -DSPDLOG_FMT_EXTERNAL \
              -O2 \
              -fPIC \
              -I "$OUT/third_party" \
              -I vita3k-source/vita3k/shader/include \
              -I vita3k-source/vita3k/util/include \
              -I vita3k-source/vita3k/gxm/include \
              -I vita3k-source/vita3k/features/include \
              -c "$SRC/$source" \
              -o "$object" \
              > "$log" 2>&1
            then
              echo "PASS: $source"
              printf '%s\tPASS\n' "$source" \
                >> "$OUT/results.tsv"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "FAIL: $source"
              printf '%s\tFAIL\n' "$source" \
                >> "$OUT/results.tsv"
              FAILED=$((FAILED + 1))

              grep -m 3 -E \
                'fatal error:|error:' \
                "$log" || tail -n 10 "$log"
            fi

            echo "::endgroup::"
          done

          {
            echo "P4G shader ARM64 batch build"
            echo "Vita3K commit:"
            cat vita3k-commit.txt
            echo
            echo "Compiled: $SUCCESS"
            echo "Failed: $FAILED"
            echo "Total: ${#SOURCES[@]}"
          } | tee "$OUT/summary.txt"

          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

          # Falhas nao interrompem a coleta dos logs.
          # A etapa final determina o resultado.

      - name: Verify ARM64 objects
        shell: bash
        run: |
          find build-shader/objects \
            -type f -name "*.o" \
            -exec file {} \; \
            > build-shader/object-types.txt

          cat build-shader/object-types.txt

          if grep -qv 'Aarch64' \
            build-shader/object-types.txt &&
            [ -s build-shader/object-types.txt ]; then
            echo "Verify ARM64 object architecture."
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4g-shader-arm64-batch
          path: |
            build-shader/summary.txt
            build-shader/results.tsv
            build-shader/logs/
            build-shader/objects/
            build-shader/object-types.txt
            vita3k-commit.txt
          if-no-files-found: warn

      - name: Check compilation result
        shell: bash
        run: |
          echo "Compilation results:"
          cat build-shader/results.tsv

          if grep -q $'\tFAIL' \
            build-shader/results.tsv; then
            echo "Some Vita3K components still need dependencies."
            exit 1
          fi

          echo "All 15 shader source files compiled."
          echo "Linking into an Android shared library is next."
