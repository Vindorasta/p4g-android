
name: Build P4G Shader ARM64

on:
  workflow_dispatch:

jobs:
  build-shader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout P4G
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.2.13676358'

      - name: Download Vita3K source
        run: |
          git clone --depth 1 \
            https://github.com/Vita3K/Vita3K.git \
            vita3k-source

          test -f \
            vita3k-source/vita3k/shader/src/usse_decode_helpers.cpp

          test -f \
            vita3k-source/vita3k/shader/src/gxp_parser.cpp

          test -f \
            vita3k-source/vita3k/shader/src/spirv_recompiler.cpp

          echo "Vita3K shader sources found"

      - name: Prepare ARM64 compiler
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android29-clang++"

          mkdir -p build-shader/logs

          "$TOOLCHAIN/aarch64-linux-android29-clang++" \
            --version

      - name: Install Vita3K dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libboost-dev \
            libspdlog-dev \
            libfmt-dev

          mkdir -p build-shader/third_party

          cp -a /usr/include/boost \
            build-shader/third_party/

          cp -a /usr/include/spdlog \
            build-shader/third_party/

          cp -a /usr/include/fmt \
            build-shader/third_party/

          test -f \
            build-shader/third_party/boost/core/demangle.hpp

          test -f \
            build-shader/third_party/spdlog/spdlog.h

          test -f \
            build-shader/third_party/fmt/format.h

          echo "Vita3K dependencies ready"

      - name: Compile real USSE decoder
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"

          mkdir -p build-shader/logs

          if "$CXX" \
            -std=c++23 \
            -include utility \
            -DSPDLOG_FMT_EXTERNAL \
            -I build-shader/third_party \
            -I vita3k-source/vita3k/shader/include \
            -I vita3k-source/vita3k/util/include \
            -I vita3k-source/vita3k/gxm/include \
            -I vita3k-source/vita3k/features/include \
            -O2 \
            -fPIC \
            -c \
            vita3k-source/vita3k/shader/src/usse_decode_helpers.cpp \
            -o build-shader/usse_decode_helpers.o \
            > build-shader/logs/usse_compile.log 2>&1
          then
            echo "USSE decoder compiled successfully"
            file build-shader/usse_decode_helpers.o
          else
            echo "USSE decoder compilation failed"
            cat build-shader/logs/usse_compile.log
            exit 1
          fi

      - name: Compile real GXP parser
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"

          mkdir -p build-shader/logs

          if "$CXX" \
            -std=c++23 \
            -include utility \
            -DSPDLOG_FMT_EXTERNAL \
            -I build-shader/third_party \
            -I vita3k-source/vita3k/shader/include \
            -I vita3k-source/vita3k/util/include \
            -I vita3k-source/vita3k/gxm/include \
            -I vita3k-source/vita3k/features/include \
            -O2 \
            -fPIC \
            -c \
            vita3k-source/vita3k/shader/src/gxp_parser.cpp \
            -o build-shader/gxp_parser.o \
            > build-shader/logs/gxp_parser_compile.log 2>&1
          then
            echo "GXP parser compiled successfully"
            file build-shader/gxp_parser.o
          else
            echo "GXP parser compilation failed"
            cat build-shader/logs/gxp_parser_compile.log
            exit 1
          fi

      - name: Verify ARM64 objects
        run: |
          set -e

          test -s build-shader/usse_decode_helpers.o
          test -s build-shader/gxp_parser.o

          file build-shader/usse_decode_helpers.o
          file build-shader/gxp_parser.o

          echo "Both Vita3K components compiled for ARM64"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4g-shader-arm64-diagnostics
          path: |
            build-shader/logs/
            build-shader/*.o
          if-no-files-found: warn
